<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- BSF emblem shield and typography -->
  <rect width="240" height="70" rx="8" fill="transparent"/>
  <g transform="translate(15, 10)">
    <!-- Shield -->
    <path d="M25 4 L42 12 V28 C42 40 25 48 25 48 C25 48 8 40 8 28 V12 Z" fill="#991B1B" stroke="#D97706" stroke-width="2"/>
    <path d="M25 10 L37 16 V26 C37 35 25 42 25 42 C25 42 13 35 13 26 V16 Z" fill="#B91C1C"/>
    <!-- Star / Emblem icon -->
    <circle cx="25" cy="22" r="6" fill="#FDE68A"/>
    <path d="M25 14 L27 20 H33 L28 23 L30 29 L25 25 L20 29 L22 23 L17 20 H23 Z" fill="#B45309"/>
    <!-- Text BSF -->
    <text x="25" y="38" font-family="sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">B S F</text>
  </g>
  <text x="75" y="32" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#1E293B" letter-spacing="0.5">BORDER SECURITY FORCE</text>
  <text x="75" y="48" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">SURVEILLANCE & DEFENSE PROJECTS</text>
</svg>
